name: Android CI and Latest Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present in repo"
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding persistent debug keystore from debug.keystore.base64"
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "Error: persistent debug keystore not found!"
            exit 1
          fi

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/sms_ledger.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-ledger-debug-apk
          path: app/build/outputs/apk/debug/sms_ledger.apk
          if-no-files-found: error

      - name: Delete existing latest release and tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up previous 'latest' release and tag..."
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (Build ${{ github.run_number }})
          body: |
            ## SMS Ledger App Release (Build ${{ github.run_number }})

            Automatically generated from commit `${{ github.sha }}` on the `main` branch.

            ### Download APK:
            - Direct Download: [sms_ledger.apk](https://github.com/${{ github.repository }}/releases/download/latest/sms_ledger.apk)

            ### Installation & Update Instructions:
            1. **Updating Existing App**:
               - This APK is signed with a unified persistent signing key. All future releases will update seamlessly over existing installations without losing any local data.
               - *Note*: If an older build on your phone was signed with a different key prior to this fix, uninstall that old build once. All subsequent updates will update directly over this version.
            2. **Google Play Protect Prompt**:
               - When side-loading an APK outside Google Play Store that requests SMS permissions, Play Protect may display an "Unrecognized app" prompt.
               - Simply tap **"More details"** and then **"Install anyway"** to complete installation.
          make_latest: true
          prerelease: false
          files: app/build/outputs/apk/debug/sms_ledger.apk
          fail_on_unmatched_files: true
          overwrite_files: true
