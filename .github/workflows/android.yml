name: Android CI and Latest Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding persistent debug keystore from debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating new debug keystore fallback"
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/sms_ledger.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-ledger-debug-apk
          path: app/build/outputs/apk/debug/sms_ledger.apk
          if-no-files-found: error

      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: |
            Automatically generated from commit ${{ github.sha }} on the main branch.
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          files: app/build/outputs/apk/debug/sms_ledger.apk
          fail_on_unmatched_files: true
          overwrite_files: true
